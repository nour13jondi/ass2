<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>نموذج تسجيل مستخدم جديد</title>
  </head>
  <body>
    <h2>إنشاء حساب جديد</h2>
    <form action="#" method="POST">
      <p>
        <label for="username">الاسم الكامل:</label><br />
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="أدخل اسمك الثلاثي"
        />
      </p>

      <p>
        <label for="email">البريد الإلكتروني:</label><br />
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="example@mail.com"
        />
      </p>

      <p>
        <label for="password">كلمة المرور:</label><br />
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="6"
        />
      </p>

      <p>
        <label for="birthdate">تاريخ الميلاد:</label><br />
        <input type="date" id="birthdate" name="birthdate" required />
      </p>

      <p>
        <label for="country">البلد:</label><br />
        <primary>
          <select id="country" name="country" required>
            <option value="">اختر بلدك...</option>
            <option value="palestine">فلسطين</option>
            <option value="egypt">مصر</option>
            <option value="jordan">الأردن</option>
          </select>
        </primary>
      </p>

      <p>
        <label>الجنس:</label><br />
        <input type="radio" id="male" name="gender" value="male" required />
        <label for="male">ذكر</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">أنثى</label>
      </p>

      <p>
        <label>الاهتمامات البرمجية:</label><br />
        <input type="checkbox" id="html" name="interests" value="html" />
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="interests" value="css" />
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="interests" value="js" />
        <label for="js">JavaScript</label>
      </p>

      <p>
        <label for="experience">مستواك الحالي في الويب (0 لـ 10):</label><br />
        <input
          type="range"
          id="experience"
          name="experience"
          min="0"
          max="10"
          value="5"
        />
      </p>

      <p>
        <label for="avatar">رفع الصورة الشخصية:</label><br />
        <input type="file" id="avatar" name="avatar" accept="image/*" />
      </p>

      <p>
        <label for="bio">نبذة مختصرة عنك:</label><br />
        <textarea
          id="bio"
          name="bio"
          rows="4"
          cols="40"
          placeholder="اكتب شيئاً عن نفسك..."
        ></textarea>
      </p>

      <p>
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">أوافق على كافة الشروط والأحكام</label>
      </p>

      <button type="submit">تسجيل البيانات</button>
      <button type="reset">تفريغ الحقول</button>
    </form>
  </body>
</html>
